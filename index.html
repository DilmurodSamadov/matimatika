<!-- simple-operations.html -->
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Kompleks Sonlar - Sodda Amallar</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f7f7f7;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .wrapper {
      width: 600px;
      background: white;
      padding: 30px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      position: relative;
    }
    h2 {
      text-align: center;
      margin-bottom: 30px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }
    label {
      font-weight: bold;
      margin-right: 8px;
    }
    input {
      width: 100px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    #result {
      background: #e0e0e0;
      padding: 20px;
      margin-top: 20px;
      text-align: center;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
    }
    .btn {
      width: 100%;
      padding: 15px;
      background: #222;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.3s;
    }
    .btn:hover {
      background: #444;
    }
    .back-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      padding: 10px 20px;
      background: #e53935;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    .back-btn:hover {
      background: #c62828;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h2>Kompleks sonlar ustida sodda amallar</h2>

    <div class="row">
      <div>
        <label for="a1">a1:</label>
        <input type="number" id="a1" placeholder="Re qism">
      </div>
      <div>
        <label for="b1">b1:</label>
        <input type="number" id="b1" placeholder="Re qism">
      </div>
    </div>

    <div class="row">
      <div>
        <label for="a2">a2:</label>
        <input type="number" id="a2" placeholder="Im qism">
      </div>
      <div>
        <label for="b2">b2:</label>
        <input type="number" id="b2" placeholder="Im qism">
      </div>
    </div>

    <button class="btn" onclick="calculate()">Submit</button>

    <div id="result">Natija shu yerda chiqadi</div>

    <button class="back-btn" onclick="window.location.href='index.html'">back</button>
  </div>

  <script>
    function calculate() {
      const a1 = parseFloat(document.getElementById('a1').value);
      const a2 = parseFloat(document.getElementById('a2').value);
      const b1 = parseFloat(document.getElementById('b1').value);
      const b2 = parseFloat(document.getElementById('b2').value);

      if (isNaN(a1) || isNaN(a2) || isNaN(b1) || isNaN(b2)) {
        document.getElementById('result').innerText = "Iltimos, barcha maydonlarni to‘ldiring!";
        return;
      }

      const complexA = { re: a1, im: a2 };
      const complexB = { re: b1, im: b2 };

      const add = {
        re: complexA.re + complexB.re,
        im: complexA.im + complexB.im
      };
      const sub = {
        re: complexA.re - complexB.re,
        im: complexA.im - complexB.im
      };
      const mul = {
        re: complexA.re * complexB.re - complexA.im * complexB.im,
        im: complexA.re * complexB.im + complexA.im * complexB.re
      };
      const denom = complexB.re**2 + complexB.im**2;
      const div = {
        re: (complexA.re * complexB.re + complexA.im * complexB.im) / denom,
        im: (complexA.im * complexB.re - complexA.re * complexB.im) / denom
      };

      document.getElementById('result').innerHTML = `
        <div><b>Qo‘shish:</b> ${add.re} + ${add.im}i</div>
        <div><b>Ayirish:</b> ${sub.re} + ${sub.im}i</div>
        <div><b>Ko‘paytirish:</b> ${mul.re} + ${mul.im}i</div>
        <div><b>Bo‘lish:</b> ${div.re.toFixed(2)} + ${div.im.toFixed(2)}i</div>
      `;
    }
  </script>
</body>
</html>
