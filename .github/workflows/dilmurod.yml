name: Subscription Feature Quality Pipeline

on:
  push:
    branches: [ develop, feature/subscription-* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-test-and-coverage:
    name: Run Unit Tests & Coverage Check
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.9, 3.10]  # Adapt for your language
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest coverage pytest-html
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run unit tests with coverage
      id: coverage-run
      run: |
        # Run tests with coverage
        coverage run --source=src/subscription -m pytest tests/unit/ -v
        
        # Generate detailed reports
        coverage report -m
        coverage html
        coverage json
        
        # Check if coverage meets threshold (80%)
        COVERAGE_PERCENT=$(coverage report --format=total | tail -1 | awk '{print $4}' | sed 's/%//')
        echo "Coverage percentage: $COVERAGE_PERCENT%"
        
        # Export coverage percentage for quality gate
        echo "COVERAGE_PERCENT=$COVERAGE_PERCENT" >> $GITHUB_ENV
        
        # Fail if below 80%
        if (( $(echo "$COVERAGE_PERCENT < 80" | bc -l) )); then
          echo "❌ Code coverage ($COVERAGE_PERCENT%) is below 80% threshold"
          exit 1
        else
          echo "✅ Code coverage ($COVERAGE_PERCENT%) meets 80% threshold"
        fi
        
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: |
          htmlcov/
          coverage.json
          
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          test-results/
          
  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test-and-coverage
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Run integration tests
      run: |
        # Setup test database
        docker-compose up -d test-db
        
        # Wait for DB to be ready
        sleep 10
        
        # Run integration tests
        pytest tests/integration/ --tb=short
        
    - name: Tear down test infrastructure
      if: always()
      run: |
        docker-compose down
        
  quality-gate:
    name: Quality Gate Enforcement
    runs-on: ubuntu-latest
    needs: [unit-test-and-coverage, integration-tests]
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Download coverage artifact
      uses: actions/download-artifact@v3
      with:
        name: coverage-report-3.9
        
    - name: Check coverage threshold
      run: |
        # Parse coverage from previous job
        echo "Checking if coverage meets 80% threshold..."
        echo "Coverage from unit tests: ${{ needs.unit-test-and-coverage.outputs.coverage }}"
        
        # This would typically parse the coverage.json file
        # For demonstration, we'll use the exported variable
        echo "✅ All quality gates passed"
        echo "Unit tests: PASSED"
        echo "Integration tests: PASSED"
        echo "Coverage threshold: MET"
        
    - name: Comment on PR
      uses: actions/github-script@v6
      if: always()
      with:
        script: |
          const coverage = process.env.COVERAGE_PERCENT || '80';
          const passed = '${{ job.status }}' === 'success';
          
          if (passed) {
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Quality Gate PASSED**\n\n- All tests passed\n- Code coverage: ${coverage}% (≥80% threshold)\n- Ready for review and merge`
            });
          } else {
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Quality Gate FAILED**\n\nCode coverage (${coverage}%) is below the 80% threshold. Please add more tests before merging.`
            });
          }
